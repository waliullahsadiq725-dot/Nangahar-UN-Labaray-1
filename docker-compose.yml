services:
  db:
    image: postgres:16
    container_name: nudl-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nudl
      POSTGRES_USER: nudl
      POSTGRES_PASSWORD: nudl_dev_password
    volumes:
      - nudl_pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nudl -d nudl"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    container_name: nudl-api
    restart: unless-stopped
    env_file:
      - ./.env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  nudl_pgdata:
